<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
    color:#fff;
    padding:20px;
  }
  .card {
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:24px;
    padding:40px 30px;
    max-width:380px;
    width:100%;
    text-align:center;
  }
  .logo {
    width:90px; height:90px;
    background:linear-gradient(135deg,#e94560,#c2185b);
    border-radius:50%;
    margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    font-size:36px; font-weight:700;
    letter-spacing:1px;
    box-shadow:0 4px 20px rgba(233,69,96,0.4);
  }
  h1 { font-size:1.5rem; font-weight:700; margin-bottom:4px; }
  .tagline { font-size:.85rem; color:rgba(255,255,255,0.6); margin-bottom:30px; }
  .links { display:flex; flex-direction:column; gap:14px; }
  .links a {
    display:flex; align-items:center; justify-content:center; gap:12px;
    padding:14px 20px;
    border-radius:14px;
    text-decoration:none;
    font-size:1rem; font-weight:600;
    transition:transform .2s, box-shadow .2s;
  }
  .links a:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,0.3); }
  .links a svg { width:22px; height:22px; flex-shrink:0; }

  .btn-insta {
    background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
    color:#fff;
  }
  .btn-wa {
    background:#25D366;
    color:#fff;
  }
  .btn-x {
    background:#000;
    color:#fff;
    border:1px solid rgba(255,255,255,0.2);
  }
  .btn-web {
    background:linear-gradient(135deg,#e94560,#c2185b);
    color:#fff;
  }
  .footer {
    margin-top:28px;
    font-size:.75rem;
    color:rgba(255,255,255,0.35);
  }
</style>
</head>
